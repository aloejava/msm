<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MSM SmartApps - Móvil Social Marketing SAS</title>
  <style>
    :root {
      --bg-dark: #0a0f1d;
      --card-bg: #141c2e;
      --accent-blue: #0066ff;
      --text-main: #ffffff;
      --text-sub: #94a3b8;
      --border-color: #1e293b;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
    }

    .msm-header-controls {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-bottom: 25px;
    }

    .msm-select {
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      cursor: pointer;
    }

    .msm-plans-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .msm-plan-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .msm-plan-card:hover {
      border-color: var(--accent-blue);
      transform: translateY(-3px);
    }

    .msm-plan-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent-blue);
      margin-top: 0;
      margin-bottom: 12px;
    }

    .msm-plan-desc {
      font-size: 14px;
      color: var(--text-sub);
      line-height: 1.5;
      margin-bottom: 20px;
      flex-grow: 1;
    }

    .msm-price-box {
      margin-bottom: 20px;
    }

    .msm-main-price {
      font-size: 24px;
      font-weight: 800;
      color: var(--text-main);
    }

    .msm-sub-price {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 4px;
    }

    .msm-btn-pay {
      display: block;
      width: 100%;
      text-align: center;
      background-color: var(--accent-blue);
      color: #ffffff;
      text-decoration: none;
      padding: 12px 0;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      transition: background-color 0.2s ease;
      box-sizing: border-box;
    }

    .msm-btn-pay:hover {
      background-color: #0052cc;
    }
  </style>
</head>
<body>

  <!-- Controles Principales (País e Idioma) -->

      <option value="EN">English (EN)</option>

    function updateMsmAppView() {
      const country = document.getElementById("msm-country-select").value;
      const lang = document.getElementById("msm-lang-select").value;
      const container = document.getElementById("msm-plans-container");
      
      const currentGroup = msmPlansData[country];
      container.innerHTML = "";

      currentGroup.plans.forEach(plan => {
        const card = document.createElement("div");
        card.className = "msm-plan-card";
        card.innerHTML = `
          <div>
            <h3 class="msm-plan-title">${plan.name[lang] || plan.name["ES"]}</h3>
            <p class="msm-plan-desc">${plan.desc[lang] || plan.desc["ES"]}</p>
          </div>
          <div>
            <div class="msm-price-box">
              <div class="msm-main-price">${plan.setup}</div>
              <div class="msm-sub-price">Mantenimiento: ${plan.monthly}</div>
            </div>
            <a href="${plan.url}" class="msm-btn-pay" target="_blank">${currentGroup.buttonText}</a>
          </div>
        `;
        container.appendChild(card);
      });
    }

    document.addEventListener("DOMContentLoaded", updateMsmAppView);
  </script>
</body>
</html>
